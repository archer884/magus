# A small card pack that uses only mechanics the engine already has. Tests load
# it to check that cards defined outside the engine behave like built-in ones.

[[card]]
key = "gullwing-courier"
name = "Gullwing Courier"
type = "creature"
cost = "2U"
subtype = "Bird"
power = 1
toughness = 2
keywords = ["flying"]
flavor = '''
"Another letter for the harbormaster.
Probably more complaints about gulls."
'''

[[card.ability]]
type = "triggered"
when = "enters"
effects = [{ type = "draw", who = "you", count = 1 }]

[[card]]
key = "harbor-toll"
name = "Harbor Toll"
type = "creature"
cost = "3B"
subtype = "Spirit"
power = 2
toughness = 3

# Two separate triggers: these resolve in the order written.
[[card.ability]]
type = "triggered"
when = "enters"
effects = [{ type = "lose_life", who = "each_opponent", amount = 2 }]

[[card.ability]]
type = "triggered"
when = "enters"
effects = [{ type = "gain_life", who = "you", amount = 2 }]

# Triggers on combat damage, and refers back to the player it hit.
[[card]]
key = "saltmarsh-cutpurse"
name = "Saltmarsh Cutpurse"
type = "creature"
cost = "1UB"
subtype = "Rogue"
power = 2
toughness = 1
keywords = ["flying"]

[[card.ability]]
type = "triggered"
when = "deals_combat_damage_to_player"
effects = [
    { type = "lose_life", who = "that_player", amount = 1 },
    { type = "draw", who = "you", count = 1 },
]

# Only hits the opponent's creatures, and can be cast again from the graveyard.
[[card]]
key = "riptide-lash"
name = "Riptide Lash"
type = "instant"
cost = "1UB"
flashback = "3UB"
effects = [
    { type = "damage", amount = 2, target = "creature", whose = "opponent" },
    { type = "draw", who = "you", count = 1 },
]

# Can bring a land with it: cheaper, and one more land on the battlefield.
[[card]]
key = "mire-herald"
name = "Mire Herald"
type = "creature"
cost = "2BB"
subtype = "Knight"
power = 3
toughness = 3

[[card.cast_option]]
reduction = "B"
action = { type = "search", kind = "land", color = "black", to = "battlefield", tapped = true }

# Stacks the deck: picks the next two draws.
[[card]]
key = "tidal-archivist"
name = "Tidal Archivist"
type = "creature"
cost = "3U"
subtype = "Wizard"
power = 2
toughness = 3

[[card.ability]]
type = "triggered"
when = "enters"
effects = [{ type = "search", count = 2, to = "top_of_library" }]

# Any card at all, straight to hand (and the opponent doesn't see which).
[[card]]
key = "deep-recall"
name = "Deep Recall"
type = "sorcery"
cost = "2B"
effects = [{ type = "search" }]

[[card]]
key = "chart-the-shoals"
name = "Chart the Shoals"
type = "sorcery"
cost = "1U"
effects = [{ type = "search", kind = "land", color = "blue", count = 2 }]

# A planeswalker: loyalty abilities, one per turn, and an emblem at the end.
[[card]]
key = "ilsa-tide-warden"
name = "Ilsa, Tide Warden"
type = "planeswalker"
cost = "2UB"
subtype = "Ilsa"
loyalty = 4

[[card.ability]]
type = "activated"
cost = { loyalty = 1 }
effects = [{ type = "draw", who = "you", count = 1 }]

[[card.ability]]
type = "activated"
cost = { loyalty = -2 }
effects = [{ type = "damage", amount = 3, target = "creature" }]

[[card.ability]]
type = "activated"
cost = { loyalty = -5 }
effects = [{ type = "emblem", power = 2, toughness = 2, keyword = "flying" }]

# A lord: makes the rest of the team bigger.
[[card]]
key = "harbor-captain"
name = "Harbor Captain"
type = "creature"
cost = "2U"
subtype = "Pirate"
power = 2
toughness = 2

[[card.ability]]
type = "static"
other = true
power = 1
toughness = 1

# An activated ability that costs mana and tapping.
[[card]]
key = "reefshot-sniper"
name = "Reefshot Sniper"
type = "creature"
cost = "1B"
subtype = "Pirate"
power = 1
toughness = 1

[[card.ability]]
type = "activated"
cost = { mana = "1", tap = true }
effects = [{ type = "damage", amount = 1, target = "any" }]

# Legendary: a second copy makes its controller keep just one.
[[card]]
key = "old-gull"
name = "Old Gull, Harbor King"
type = "creature"
cost = "3U"
subtype = "Bird"
power = 3
toughness = 3
legendary = true
keywords = ["flying"]

[[deck]]
key = "harbor-tides"
name = "Harbor Tides"
description = "Blue/black fliers and drain, from the sample pack."

[deck.cards]
gullwing-courier = 4
harbor-toll = 4
riptide-lash = 4
saltmarsh-cutpurse = 4
mire-herald = 2
tidal-archivist = 2
reefshot-sniper = 2
old-gull = 2
wailing-shade = 4
deep-recall = 2
chart-the-shoals = 2
ilsa-tide-warden = 2
harbor-captain = 2
lagoon = 12
bog = 12
